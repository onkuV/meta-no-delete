name: Docker Publish

on:
  workflow_dispatch: {}
  push:
    branches:
      - main
      - 'v*.*.*'
    tags:
      - 'v*.*.*'

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    strategy:
      fail-fast: false
      matrix:
        include:
          # Messenger bridge (mautrix-meta), published without a tag prefix.
          - variant: fb
            dockerfile: Dockerfile
            prefix: ''
          # Instagram bridge (mautrix-instagram), published as ig-latest, ig-main, ...
          - variant: ig
            dockerfile: Dockerfile.ig
            prefix: 'ig-'

    name: build-and-push (${{ matrix.variant }})

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/matrix-meta-nodelete
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
          # onlatest=true also prefixes the "latest" tag, so it becomes ig-latest.
          flavor: |
            prefix=${{ matrix.prefix }},onlatest=true

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          file: ${{ matrix.dockerfile }}
